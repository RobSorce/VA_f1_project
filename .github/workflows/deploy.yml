name: Deploy to GitHub Pages

# The GitHub Pages site is the static demo of the dashboard (no backend:
# frontend/src/utils/demoMode.js): the demo build (vite --mode demo) answers
# the API from frontend/public/data, written by
# backend/scripts/export_demo_data.py. It is built from the working branch
# (v4) and from main, and deployed only when the frontend and backend tests
# pass (jobs test-frontend and test-backend).
on:
  push:
    branches: [main, v4]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Vitest; the tests that need the git-ignored processed caches skip, as on
  # a fresh clone
  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Frontend tests
        run: cd frontend && npm test

  # pytest; the data tests skip without the FastF1 caches (backend/tests/conftest.py)
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # PyTorch first, from its CPU wheel index (the default Linux wheel
      # pulls the CUDA libraries, several GB); requirements.txt then finds it
      # installed
      - name: Install dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r backend/requirements.txt pytest

      - name: Backend tests
        run: cd backend && python -m pytest -q

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      # Served under https://<owner>.github.io/<repository>/
      - name: Build the static demo
        run: cd frontend && npm run build:demo
        env:
          DEMO_BASE: /${{ github.event.repository.name }}/

      # Serves dist/ as Pages does and loads every demo race, its PCA biplot
      # and a lasso analysis with no backend (frontend/scripts/serve_dist_check.mjs)
      - name: Check the static demo
        run: cd frontend && npm run check:demo
        env:
          DEMO_BASE: /${{ github.event.repository.name }}/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # no deploy unless both test jobs and the build passed
    needs: [test-frontend, test-backend, build]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
