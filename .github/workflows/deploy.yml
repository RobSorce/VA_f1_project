name: Deploy to GitHub Pages

# The GitHub Pages site is the static demo of the dashboard (no backend:
# frontend/src/utils/demoMode.js): the demo build (vite --mode demo) answers
# the API from frontend/public/data, written by
# backend/scripts/export_demo_data.py. It is built from the working branch
# (v4) and from main.
on:
  push:
    branches: [main, v4]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      # Served under https://<owner>.github.io/<repository>/
      - name: Build the static demo
        run: cd frontend && npm run build:demo
        env:
          DEMO_BASE: /${{ github.event.repository.name }}/

      # Serves dist/ as Pages does and loads every demo race, its PCA biplot
      # and a lasso analysis with no backend (frontend/scripts/serve_dist_check.mjs)
      - name: Check the static demo
        run: cd frontend && npm run check:demo
        env:
          DEMO_BASE: /${{ github.event.repository.name }}/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
